name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Validated toolchain for the pinned FluidAudio 0.12.5 dependency graph.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
      - name: Install test inventory dependency
        run: brew install ripgrep
      - name: Validate UI test inventory
        run: ./scripts/validate_ui_test_cases.sh
      - name: Reproduce historical audio overwrite
        run: ./scripts/run_audio_storage_tests.sh d48af9d9cfc04c6ea0ad208a7de55303551e2c78
      - name: Verify audio preservation
        run: ./scripts/run_audio_storage_tests.sh
      - name: Reproduce historical Unicode truncation
        run: ./scripts/run_text_chunker_tests.sh d48af9d9cfc04c6ea0ad208a7de55303551e2c78
      - name: Verify complete Unicode chunks
        run: ./scripts/run_text_chunker_tests.sh
      - name: Reproduce invalid chunk-size failures
        run: ./scripts/run_invalid_chunk_size_tests.sh 7f2b2d578fa86bf2712a3e334b812036019d9e7b
      - name: Verify invalid chunk sizes are rejected
        run: ./scripts/run_invalid_chunk_size_tests.sh
      - name: Reproduce implicit processing requests
        run: ./scripts/run_processing_privacy_tests.sh e2d9fb1af85a59d9f0b4189e10f45474a3d918f3
      - name: Reproduce direct generated-output logging
        run: ./scripts/run_processing_privacy_tests.sh b33131bbcf499cd05040759007db69e01c990def --expect-legacy-output-logs
      - name: Verify processing request boundaries and output logging
        run: ./scripts/run_processing_privacy_tests.sh
      - name: Build unmodified Release sources
        run: xcodebuild -project VibeScribe.xcodeproj -scheme VibeScribe -configuration Release -destination 'platform=macOS' -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO build
      - name: Test settings and isolated processing UI
        run: xcodebuild -project VibeScribe.xcodeproj -scheme VibeScribeUITests -configuration Debug -destination 'platform=macOS' -disableAutomaticPackageResolution -only-testing:VibeScribeUITests/ChunkSizeValidationTests -only-testing:VibeScribeUITests/SummaryConfigurationTests -only-testing:VibeScribeUITests/MockPipelineFlowTests/testMockFlow_NoSpeakers_EndToEndFromFirstLaunchToManualSummaryEdit -only-testing:VibeScribeUITests/MockPipelineFlowTests/testMockFlow_ProviderMatrix_TranscriptionReflectsSelectedProvider -only-testing:VibeScribeUITests/MockPipelineFlowTests/testMockFlow_AutoSummaryError_ManualRetryWithAnotherModelSucceeds CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test
